name: Refresh SBIR (Mondays 10am EDT)

on:
  schedule:
    # 10am EDT = 14:00 UTC, 10am EST = 15:00 UTC. We run both for year-round coverage.
    - cron: "0 14 * * 1"
    - cron: "0 15 * * 1"
  workflow_dispatch: {}

permissions:
  contents: write

concurrency:
  group: refresh-sbir
  cancel-in-progress: false

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Fetch SBIR awards
        run: node scripts/fetch-sbir.mjs

      - name: Commit + push if changed
        run: |
          set -e
          git config user.name  "spaceintel-bot"
          git config user.email "spaceintel-bot@users.noreply.github.com"
          if git diff --quiet -- data/sbir.json; then
            echo "No changes."
            exit 0
          fi
          git add data/sbir.json
          git commit -m "chore(sbir): weekly refresh $(date -u +%Y-%m-%d)"
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed."; exit 1; }
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; remote moved. Retrying…"
            sleep 4
          done
          echo "All push attempts exhausted."
          exit 1
