name: Refresh news (daily 9am EDT)

on:
  schedule:
    # 9am EDT = 13:00 UTC (during daylight time, Mar–Nov)
    # 9am EST = 14:00 UTC (during standard time, Nov–Mar)
    # We run at both to keep a daily 9am-local cadence year-round; the
    # script is idempotent so running twice in winter does no harm.
    - cron: "0 13 * * *"
    - cron: "0 14 * * *"
  workflow_dispatch: {}        # lets you trigger manually from the Actions tab

permissions:
  contents: write              # needed to commit data/news.json + data/digest.json

concurrency:
  group: refresh-news
  cancel-in-progress: false

env:
  # Opt into Node 24 for the JS actions ahead of the June 2026 default.
  # Removes the Node 20 deprecation warning; harmless if already on 24.
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm install --no-audit --no-fund

      - name: Fetch + summarise news
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_MODELS_TOKEN:   ${{ secrets.GH_MODELS_TOKEN }}
          # Override the default model name if you want, e.g. "openai/gpt-4o"
          # MODEL:           "openai/gpt-4o-mini"
        run: node scripts/fetch-news.mjs

      - name: Regenerate briefing
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          GH_MODELS_TOKEN:   ${{ secrets.GH_MODELS_TOKEN }}
        run: node scripts/generate-briefing.mjs

      - name: Commit + push if changed
        run: |
          set -e
          git config user.name  "spaceintel-bot"
          git config user.email "spaceintel-bot@users.noreply.github.com"
          if git diff --quiet -- data/news.json data/digest.json data/briefing.json; then
            echo "No changes."
            exit 0
          fi
          git add data/news.json data/digest.json data/briefing.json
          git commit -m "chore(news): daily refresh $(date -u +%Y-%m-%d)"
          # Retry on remote-moved conflict (someone else pushed during our run)
          for i in 1 2 3; do
            git fetch origin main
            git rebase origin/main || { echo "Rebase failed."; exit 1; }
            if git push; then
              echo "Pushed on attempt $i."
              exit 0
            fi
            echo "Push attempt $i failed; remote moved. Retrying…"
            sleep 4
          done
          echo "All push attempts exhausted."
          exit 1
